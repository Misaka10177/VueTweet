server.port=3000

spring.datasource.url=jdbc:mysql://localhost:3306/twitter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=uploads

# --- Authentication ---
# Use a long random value in production (>= 32 bytes) and inject it via JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-2026}
app.jwt.issuer=twitter-api
app.jwt.audience=twitter-web
app.jwt.access-ttl=PT15M

app.auth.refresh-ttl=P30D
app.auth.session-ttl=P30D
app.auth.cookie-name=refresh_token
app.auth.cookie-path=/auth
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax
app.auth.max-sessions=10

# Same-site frontend origins allowed to send the refresh cookie.
app.auth.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Local demo only: create a BCrypt password (123456) for users that have no
# credential yet. Set to false / remove after accounts are initialized.
app.auth.seed-default-password=true
